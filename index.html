<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="container">
            <div class="home-guest">
                <h3>HOME</h3>
                <div class="scoreboard">
                    <p id="home-points">0</p>
                </div>
                <div class="btns">
                    <button class="btn1" onclick="plus1Home()">+1</button>
                    <button class="btn2" onclick="plus2Home()">+2</button>
                    <button class="btn3" onclick="plus3Home()">+3</button>
                </div>
            </div>
            
            <div class="home-guest">
                <h3>GUEST</h3>
                <div class="scoreboard">
                    <p id="guest-points">0</p>
                </div>
                <div class="btns">
                    <button class="btn1" onclick="plus1Guest()">+1</button>
                    <button class="btn2" onclick="plus2Guest()">+2</button>
                    <button class="btn3" onclick="plus3Guest()">+3</button>
                </div>
            </div>
        </div>
        
        <h4>by Raver</h4>

        <script src="index.js"></script>
    </body>
</html>
